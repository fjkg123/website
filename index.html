
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议室预约及查询</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #f3f5f9;
  color: #18263b;
}

header {
  background: #1b5599;
  color: white;
  padding: 18px 25px;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 5px 0 0;
  font-size: 16px;
  opacity: .9;
}

main {
  max-width: 1400px;
  margin: auto;
  padding: 25px 15px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

h2 { font-size: 25px; }

.desc {
  color: #60718a;
  line-height: 1.7;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border-radius: 9px;
  padding: 11px 20px;
  border: 1px solid #d0dbea;
  background: white;
  color: #48617e;
}

button:hover { opacity: .9; }
button:disabled { opacity: .5; cursor: wait; }

.primary {
  background: #18549c;
  color: white;
  border: none;
}

.filters {
  background: white;
  border: 1px solid #dfe5ef;
  border-radius: 18px;
  padding: 22px;
  margin: 24px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: end;
}

.field { flex: 1; min-width: 160px; }

label {
  display: block;
  color: #58708c;
  margin-bottom: 8px;
}

input, select, textarea {
  width: 100%;
  border: 1px solid #cfdae9;
  border-radius: 8px;
  background: white;
  padding: 11px 12px;
  color: #253950;
}

textarea {
  min-height: 70px;
  resize: vertical;
}

.sort {
  display: flex;
  gap: 0;
}

.sort button { border-radius: 0; }

.sort button:first-child {
  border-radius: 8px 0 0 8px;
}

.sort button:last-child {
  border-radius: 0 8px 8px 0;
}

.sort .active {
  background: #18549c;
  color: white;
}

.table-wrap {
  background: white;
  border: 1px solid #dfe5ef;
  border-radius: 18px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th, td {
  padding: 16px 18px;
  text-align: left;
  border-bottom: 1px solid #e3eaf3;
}

th {
  background: #f5f7fb;
  color: #506580;
}

td { font-size: 14px; }

.room-tag {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 20px;
  background: #e4efff;
  color: #18549c;
  font-weight: bold;
}

.past {
  background: #f2f3f5;
  color: #a0a8b3;
}

.past .room-tag {
  background: #e5e7eb;
  color: #9098a5;
}

.group-sep td { border-top: 3px solid #d3dfef; }

.danger {
  color: #c43939;
  border: 1px solid #f0caca;
}

.small-btn {
  font-size: 13px;
  padding: 7px 10px;
}

#status {
  padding: 14px;
  color: #667b94;
  font-size: 14px;
}

/* 弹窗 */
.mask {
  position: fixed;
  inset: 0;
  background: rgba(24, 35, 52, .48);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 100;
}

.mask.open { display: flex; }

.modal {
  background: white;
  border-radius: 15px;
  width: 100%;
  max-width: 520px;
  padding: 24px;
  max-height: 92vh;
  overflow-y: auto;
}

.modal h3 {
  margin: 0 0 20px;
  font-size: 19px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.full { grid-column: 1 / -1; }

.required { color: #d33; }

.hint {
  font-size: 12px;
  color: #71829a;
  background: #f5f7fb;
  padding: 10px;
  border-radius: 7px;
  line-height: 1.6;
}

.error {
  color: #db3535;
  font-size: 13px;
  margin: 12px 0;
  line-height: 1.6;
}

.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 15px;
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e7b4d;
  color: white;
  padding: 14px 25px;
  border-radius: 10px;
  display: none;
  z-index: 200;
  box-shadow: 0 8px 25px #0002;
}

.toast.show { display: block; }
.toast.err { background: #c83737; }

@media(max-width: 650px) {
  header h1 { font-size: 21px; }
  .top h2 { font-size: 20px; }
  .filters { padding: 15px; }
  .field { min-width: 100%; }
  .form-grid { grid-template-columns: 1fr; }
  .full { grid-column: 1; }
  .modal { padding: 18px; }
}
</style>
</head>

<body>

<header>
  <h1>▣ 会议室预约及查询</h1>
  <p>预约 · 查看 · 取消一站完成，数据实时同步</p>
</header>

<main>

  <div class="top">
    <h2>会议室预约安排</h2>
    <button class="primary" onclick="openBooking()">
      ＋ 预约会议室
    </button>
  </div>

  <p class="desc">
    相同会议室的会议集中排列，并按时间先后排序；
    已结束的会议置底灰显，结束满1天后自动从列表隐藏。
  </p>

  <div class="filters">
    <div class="field">
      <label>按日期筛选</label>
      <input type="date" id="f-date" onchange="renderTable()">
    </div>

    <div class="field">
      <label>按会议室筛选</label>
      <select id="f-room" onchange="renderTable()">
        <option value="">全部会议室</option>
      </select>
    </div>

    <div class="field">
      <label>按科室筛选</label>
      <select id="f-dept" onchange="renderTable()">
        <option value="">全部科室</option>
      </select>
    </div>

    <button onclick="resetFilters()">重置</button>

    <div class="field">
      <label>排列方式</label>
      <div class="sort">
        <button id="sort-room" class="active"
          onclick="setSort('room')">按会议室归类</button>
        <button id="sort-time"
          onclick="setSort('time')">按时间先后</button>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>时间</th>
          <th>会议室</th>
          <th>会议内容</th>
          <th>科室</th>
          <th>联系人</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="status">正在连接数据库...</div>
  </div>

</main>

<!-- 预约弹窗 -->
<div class="mask" id="booking-mask">
  <div class="modal">
    <h3>预约会议室</h3>

    <form id="booking-form">
      <div class="form-grid">

        <div>
          <label>会议室 <span class="required">*</span></label>
          <select id="b-room" required>
            <option value="">请选择</option>
          </select>
        </div>

        <div>
          <label>日期 <span class="required">*</span></label>
          <input type="date" id="b-date" required>
        </div>

        <div>
          <label>开始时间 <span class="required">*</span></label>
          <input type="time" id="b-start" required>
        </div>

        <div>
          <label>结束时间 <span class="required">*</span></label>
          <input type="time" id="b-end" required>
        </div>

        <div class="full">
          <label>会议内容 <span class="required">*</span></label>
          <textarea id="b-topic" required></textarea>
        </div>

        <div>
          <label>科室 <span class="required">*</span></label>
          <select id="b-dept">
            <option value="">请选择</option>
          </select>
        </div>

        <div>
          <label>自行填写科室</label>
          <input id="b-other" placeholder="其他科室">
        </div>

        <div class="full hint">
          科室与自行填写科室二选一。
          选择下拉科室后，自行填写栏自动禁用；
          自行填写内容后，下拉科室自动禁用。
        </div>

        <div class="full">
          <label>联系人 <span class="required">*</span></label>
          <input id="b-contact" required
            placeholder="姓名 / 电话">
        </div>

      </div>

      <div id="form-error" class="error"></div>

      <div class="modal-foot">
        <button type="button" onclick="closeBooking()">取消</button>
        <button type="submit" class="primary" id="submit-btn">
          提交预约
        </button>
      </div>

    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* ==========================================
   Supabase 数据库连接
========================================== */

const SUPABASE_URL =
  "https://bugapibdejznlasixvml.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ti20te-PJlgJp5djKSWxnA_zp20kqTC";

const ROOMS = ["1号", "2号", "3号", "4号", "5号"];

const DEPTS = [
  "党政办", "党建办", "经济办",
  "公服办", "平安办", "城管办",
  "应急办", "纪检办", "执法队"
];

const TOKEN_KEY = "meeting_cancel_tokens";

let db = null;
let allRows = [];
let sortMode = "room";
let refreshTimer = null;
let loading = false;

const $ = id => document.getElementById(id);

/* ==========================================
   基础工具
========================================== */

function showToast(message, error = false) {
  const box = $("toast");
  box.textContent = message;
  box.className = "toast show" + (error ? " err" : "");
  setTimeout(() => box.className = "toast", 3000);
}

function timeText(value) {
  return String(value || "").slice(0, 5);
}

function endTimestamp(row) {
  return new Date(
    row.meeting_date + "T" + timeText(row.end_time)
  ).getTime();
}

function isPast(row) {
  return endTimestamp(row) < Date.now();
}

function isVisible(row) {
  return Date.now() - endTimestamp(row) <= 86400000;
}

function roomOrder(room) {
  const n = ROOMS.indexOf(room);
  return n < 0 ? 99 : n;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ==========================================
   下拉列表初始化
========================================== */

function addOptions(id, values) {
  const select = $(id);

  values.forEach(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });
}

function initOptions() {
  addOptions("b-room", ROOMS);
  addOptions("f-room", ROOMS);
  addOptions("b-dept", DEPTS);
  addOptions("f-dept", DEPTS);
}

/* ==========================================
   科室二选一
========================================== */

function syncDepartment() {
  const dept = $("b-dept");
  const other = $("b-other");

  if (other.value.trim()) {
    dept.value = "";
    dept.disabled = true;
    other.disabled = false;
  } else if (dept.value) {
    other.value = "";
    other.disabled = true;
    dept.disabled = false;
  } else {
    dept.disabled = false;
    other.disabled = false;
  }
}

/* ==========================================
   数据读取
========================================== */

async function loadBookings() {
  if (!db || loading) return;

  loading = true;

  try {
    const { data, error } = await db
      .from("meeting_bookings")
      .select(
        "id,meeting_date,start_time,end_time,room,topic,department,contact"
      )
      .order("meeting_date", { ascending: true });

    if (error) throw error;

    allRows = (data || []).filter(isVisible);

    renderTable();

  } catch (error) {
    console.error("读取预约失败:", error);
    $("status").textContent =
      "读取预约记录失败，请检查数据库连接或权限。";
  } finally {
    loading = false;
  }
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(loadBookings, 300);
}

/* ==========================================
   表格显示
========================================== */

function renderTable() {
  const dateFilter = $("f-date").value;
  const roomFilter = $("f-room").value;
  const deptFilter = $("f-dept").value;

  let rows = allRows.filter(row => {
    if (dateFilter && row.meeting_date !== dateFilter) return false;
    if (roomFilter && row.room !== roomFilter) return false;
    if (deptFilter && row.department !== deptFilter) return false;
    return true;
  });

  rows.sort((a, b) => {
    if (sortMode === "room") {
      const diff = roomOrder(a.room) - roomOrder(b.room);
      if (diff) return diff;
    }

    const pastA = isPast(a) ? 1 : 0;
    const pastB = isPast(b) ? 1 : 0;

    if (pastA !== pastB) return pastA - pastB;

    const keyA = a.meeting_date + timeText(a.start_time);
    const keyB = b.meeting_date + timeText(b.start_time);

    if (pastA) return keyB.localeCompare(keyA);
    return keyA.localeCompare(keyB);
  });

  const tbody = $("tbody");
  tbody.innerHTML = "";

  let previousRoom = null;

  rows.forEach(row => {
    const past = isPast(row);

    const tr = document.createElement("tr");
    if (past) tr.classList.add("past");

    if (sortMode === "room" &&
        previousRoom !== null &&
        previousRoom !== row.room) {
      tr.classList.add("group-sep");
    }

    previousRoom = row.room;

    const date = escapeHtml(row.meeting_date);
    const start = escapeHtml(timeText(row.start_time));
    const end = escapeHtml(timeText(row.end_time));
    const room = escapeHtml(row.room);
    const topic = escapeHtml(row.topic);
    const dept = escapeHtml(row.department);
    const contact = escapeHtml(row.contact);

    tr.innerHTML = `
      <td>${date}</td>
      <td><strong>${start} - ${end}</strong></td>
      <td><span class="room-tag">${room}</span></td>
      <td>${past ? "【已结束】" : ""}${topic}</td>
      <td>${dept}</td>
      <td>${contact}</td>
      <td>
        <button class="small-btn danger cancel-btn">
          取消预约
        </button>
      </td>
    `;

    tr.querySelector(".cancel-btn").onclick =
      () => cancelBooking(row.id);

    tbody.appendChild(tr);
  });

  $("status").textContent =
    rows.length
      ? `共 ${rows.length} 条预约记录 · 数据来自共享数据库`
      : "暂无符合条件的预约记录";
}

function resetFilters() {
  $("f-date").value = "";
  $("f-room").value = "";
  $("f-dept").value = "";
  renderTable();
}

function setSort(mode) {
  sortMode = mode;

  $("sort-room").classList.toggle("active", mode === "room");
  $("sort-time").classList.toggle("active", mode === "time");

  renderTable();
}

/* ==========================================
   打开和关闭预约窗口
========================================== */

function openBooking() {
  $("booking-mask").classList.add("open");
  $("form-error").textContent = "";

  if (!$("b-date").value) {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    $("b-date").value = `${y}-${m}-${d}`;
  }

  loadBookings();
}

function closeBooking() {
  $("booking-mask").classList.remove("open");
}

/* ==========================================
   时间冲突检查
========================================== */

function findConflict(room, date, start, end) {
  return allRows.find(row =>
    row.room === room &&
    row.meeting_date === date &&
    start < timeText(row.end_time) &&
    timeText(row.start_time) < end
  );
}

/* ==========================================
   提交预约
========================================== */

async function submitBooking(event) {
  event.preventDefault();

  const errorBox = $("form-error");
  const button = $("submit-btn");

  errorBox.textContent = "";

  if (!db) {
    errorBox.textContent = "数据库尚未连接，无法提交预约。";
    return;
  }

  const room = $("b-room").value;
  const date = $("b-date").value;
  const start = $("b-start").value;
  const end = $("b-end").value;
  const topic = $("b-topic").value.trim();
  const department =
    $("b-dept").value || $("b-other").value.trim();
  const contact = $("b-contact").value.trim();

  if (!room || !date || !start || !end ||
      !topic || !department || !contact) {
    errorBox.textContent = "请填写所有必填项。";
    return;
  }

  if (end <= start) {
    errorBox.textContent = "结束时间必须晚于开始时间。";
    return;
  }

  if (topic.length > 200 ||
      department.length > 100 ||
      contact.length > 100) {
    errorBox.textContent = "填写内容过长，请适当缩短。";
    return;
  }

  button.disabled = true;
  button.textContent = "正在提交...";

  try {
    await loadBookings();

    const conflict = findConflict(room, date, start, end);

    if (conflict) {
      errorBox.textContent =
        `预约时间冲突！${room}会议室已在` +
        `${timeText(conflict.start_time)}-` +
        `${timeText(conflict.end_time)}被预约。`;
      return;
    }

    // 生成安全随机取消凭证
    const bytes = new Uint8Array(24);
    crypto.getRandomValues(bytes);

    const cancelToken = Array.from(bytes)
      .map(v => v.toString(16).padStart(2, "0"))
      .join("");

    // 调用数据库预约函数
    const { data, error } = await db.rpc(
      "create_meeting_booking",
      {
        p_date: date,
        p_start: start,
        p_end: end,
        p_room: room,
        p_topic: topic,
        p_department: department,
        p_contact: contact,
        p_cancel_token: cancelToken
      }
    );

    if (error) throw error;

    // 本机保存取消凭证
    try {
      const tokens = JSON.parse(
        localStorage.getItem(TOKEN_KEY) || "{}"
      );

      tokens[data] = cancelToken;

      localStorage.setItem(
        TOKEN_KEY,
        JSON.stringify(tokens)
      );
    } catch (e) {
      console.warn("无法在本机保存取消凭证", e);
    }

    $("booking-form").reset();
    syncDepartment();
    closeBooking();

    await loadBookings();
    showToast("预约成功！");

  } catch (error) {
    console.error("预约失败:", error);

    if (error.code === "23P01") {
      errorBox.textContent =
        "预约失败：该会议室的时间已被其他人预约，请更换时间。";
      await loadBookings();
    } else {
      errorBox.textContent =
        "提交失败，请检查数据库设置或网络连接。";
    }
  } finally {
    button.disabled = false;
    button.textContent = "提交预约";
  }
}

/* ==========================================
   取消预约
========================================== */

async function cancelBooking(id) {
  if (!db) {
    showToast("数据库尚未连接", true);
    return;
  }

  if (!confirm("确定取消该会议室预约吗？")) return;

  let tokens = {};

  try {
    tokens = JSON.parse(
      localStorage.getItem(TOKEN_KEY) || "{}"
    );
  } catch (e) {}

  let token = tokens[id];

  if (!token) {
    token = prompt("请输入预约时获得的取消凭证：");
  }

  if (!token) return;

  try {
    const { data, error } = await db.rpc(
      "cancel_meeting_booking",
      {
        p_id: id,
        p_cancel_token: token
      }
    );

    if (error) throw error;

    if (!data) {
      showToast("取消凭证不正确", true);
      return;
    }

    delete tokens[id];

    try {
      localStorage.setItem(
        TOKEN_KEY,
        JSON.stringify(tokens)
      );
    } catch (e) {}

    showToast("预约已取消");

    await loadBookings();

  } catch (error) {
    console.error("取消预约失败:", error);
    showToast("取消失败，请稍后重试", true);
  }
}

/* ==========================================
   数据库初始化和实时同步
========================================== */

function initialize() {
  initOptions();

  $("b-dept").addEventListener("change", syncDepartment);
  $("b-other").addEventListener("input", syncDepartment);

  $("booking-form").addEventListener(
    "submit",
    submitBooking
  );

  $("booking-mask").addEventListener("click", event => {
    if (event.target === $("booking-mask")) closeBooking();
  });

  if (!window.supabase) {
    $("status").textContent =
      "Supabase 脚本加载失败，请检查网络。";
    return;
  }

  try {
    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    loadBookings();

    // 数据库发生变化时刷新
    db.channel("meeting-bookings-live")
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "meeting_bookings"
        },
        () => scheduleRefresh()
      )
      .subscribe();

    // 实时连接暂时中断时，也会定期重新读取
    setInterval(() => {
      if (document.visibilityState === "visible") {
        scheduleRefresh();
      }
    }, 60000);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        scheduleRefresh();
      }
    });

  } catch (error) {
    console.error("数据库初始化失败:", error);
    $("status").textContent =
      "数据库连接初始化失败，请检查配置。";
  }
}

initialize();
</script>

</body>
</html>
