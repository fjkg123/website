<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议室预约及查询</title>
<style>
  :root {
    --brand: #14539a;
    --ink: #1c2430;
    --ink-2: #5a6675;
    --line: #e3e8ef;
    --bg: #f4f6f9;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .topbar {
    background: var(--brand);
    color: #fff;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  .topbar .sub { font-size: 12px; opacity: .8; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 20px 16px 60px; }

  .hero { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .hero h2 { margin: 0 4px 0 0; font-size: 20px; }
  .hero .spacer { flex: 1; }
  .hero p { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; width: 100%; }

  .toolbar {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--ink-2); }
  .toolbar .spacer { flex: 1; }
  input[type="date"], input[type="time"], input[type="text"], select {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid #d5dbe4; border-radius: 7px; padding: 7px 10px; min-width: 130px; outline: none;
  }
  input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(20,83,154,.1); }
  input:disabled, select:disabled { background: #f2f4f7; color: #9aa4b0; }
  .btn {
    font: inherit; border-radius: 7px; padding: 8px 16px; cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: #103f78; }
  .btn-primary:disabled { background: #9db4d0; cursor: not-allowed; }
  .btn-ghost { background: #fff; border-color: #d5dbe4; color: var(--ink-2); }
  .btn-ghost:hover { border-color: var(--brand); color: var(--brand); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #a33024; }
  .btn-mini {
    font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid #e0c9c5; background: #fff; color: var(--danger); cursor: pointer;
  }
  .btn-mini:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .seg { display: inline-flex; border: 1px solid #d5dbe4; border-radius: 7px; overflow: hidden; background: #fff; }
  .seg button { font: inherit; border: none; background: #fff; padding: 7px 14px; cursor: pointer; color: var(--ink-2); }
  .seg button.on { background: var(--brand); color: #fff; }

  .tablebox { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tablescroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 940px; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f7f9fc; font-size: 12.5px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  td.strong { font-weight: 600; }
  .room-tag {
    display: inline-block; padding: 2px 9px; border-radius: 5px; font-size: 12px;
    background: #eef1f5; color: var(--ink); white-space: nowrap;
  }
  .done-tag {
    display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11.5px;
    background: #e6e8eb; color: #8b97a6; margin-right: 6px;
  }
  tr.r1 { background: #f2f7fd; }
  tr.r2 { background: #f1f8f2; }
  tr.r3 { background: #fdf6ec; }
  tr.r4 { background: #f4f1fb; }
  tr.r5 { background: #f0f9f8; }
  tr.past { background: #f6f7f8; color: #9aa4b0; }
  tr.past .room-tag { background: #eceef1; color: #9aa4b0; }
  tr.past td.strong { font-weight: 500; color: #9aa4b0; }
  tr.group-sep td { border-top: 2px solid #dbe3ee; }
  .empty { padding: 46px 16px; text-align: center; color: var(--ink-2); font-size: 13px; }
  .sync { float: right; color: #8b97a6; }
  .status { padding: 10px 16px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); background: #fbfcfe; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(16,28,44,.45); display: none;
    align-items: center; justify-content: center; padding: 18px; z-index: 50;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto; padding: 22px 24px 20px;
  }
  .modal.narrow { max-width: 400px; }
  .modal h3 { margin: 0 0 16px; font-size: 17px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ff { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .ff label { font-size: 12.5px; color: var(--ink-2); }
  .ff label i { color: var(--danger); font-style: normal; }
  .ff input, .ff select { width: 100%; }
  .ff textarea {
    font: inherit; border: 1px solid #d5dbe4; border-radius: 7px; padding: 8px 10px;
    resize: vertical; min-height: 66px; outline: none; color: var(--ink);
  }
  .ff textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(20,83,154,.1); }
  .hint {
    font-size: 12px; color: var(--ink-2); margin: -6px 0 12px;
    background: #f6f8fb; border-radius: 6px; padding: 7px 10px;
  }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .tip { font-size: 12px; color: var(--danger); min-height: 18px; margin: 0 0 8px; }
  .warn {
    font-size: 12.5px; color: #8a5a00; background: #fff7e6;
    border: 1px solid #ffd591; border-radius: 6px; padding: 8px 10px; margin: 0 0 10px;
  }
  .hide { display: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #1c2430; color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; z-index: 80; opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }

  @media (max-width: 560px) {
    .grid2 { grid-template-columns: 1fr; }
    .wrap { padding: 16px 12px 48px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="mark">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path>
    </svg>
  </div>
  <div>
    <h1>会议室预约及查询</h1>
    <div class="sub">预约 · 查看 · 取消一站完成，数据实时同步</div>
  </div>
</header>

<div class="wrap">

  <div class="hero">
    <h2>会议室预约安排</h2>
    <div class="spacer"></div>
    <button type="button" class="btn btn-primary" id="btn-book">＋ 预约会议室</button>
    <p>相同会议室的会议集中排列、底色统一并按时间先后排序；已结束的会议置底灰显，结束满 1 天后自动清理。</p>
  </div>

  <div class="toolbar">
    <div class="field">
      <label for="f-date">按日期筛选</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label for="f-room">按会议室筛选</label>
      <select id="f-room"><option value="">全部会议室</option></select>
    </div>
    <div class="field">
      <label for="f-dept">按科室筛选</label>
      <select id="f-dept"><option value="">全部科室</option></select>
    </div>
    <button type="button" class="btn btn-ghost" id="btn-reset">重置</button>
    <div class="spacer"></div>
    <div class="field">
      <label>排列方式</label>
      <div class="seg">
        <button type="button" id="seg-room" class="on">按会议室归类</button>
        <button type="button" id="seg-time">按时间先后</button>
      </div>
    </div>
  </div>

  <div class="tablebox">
    <div class="tablescroll">
      <table>
        <thead>
          <tr>
            <th style="width:120px">日期</th>
            <th style="width:130px">时间</th>
            <th style="width:120px">会议室</th>
            <th>会议内容</th>
            <th style="width:120px">科室</th>
            <th style="width:110px">联系人</th>
            <th style="width:90px">操作</th>
          </tr>
        </thead>
        <tbody id="tbody" data-sp-bindable="database" data-sp-database-id="zQEJ6GAln8ovwvQxDvgxdw"></tbody>
      </table>
    </div>
    <div class="empty hide" id="empty">暂无预约记录</div>
    <div class="status" id="status" data-sp-bindable="database" data-sp-database-id="zQEJ6GAln8ovwvQxDvgxdw">正在读取…<span id="sync-time" class="sync"></span></div>
  </div>
</div>

<!-- 预约弹窗 -->
<div class="modal-mask" id="mask">
  <div class="modal">
    <h3>预约会议室</h3>
    <form id="book-form" novalidate>
      <div class="grid2">
        <div class="ff">
          <label for="b-room">会议室 <i>*</i></label>
          <select id="b-room" name="room"><option value="">请选择</option></select>
        </div>
        <div class="ff">
          <label for="b-date">日期 <i>*</i></label>
          <input type="date" id="b-date" name="date">
        </div>
      </div>
      <div class="grid2">
        <div class="ff">
          <label for="b-start">开始时间 <i>*</i></label>
          <input type="time" id="b-start" name="start" step="300">
        </div>
        <div class="ff">
          <label for="b-end">结束时间 <i>*</i></label>
          <input type="time" id="b-end" name="end" step="300">
        </div>
      </div>
      <div class="ff">
        <label for="b-topic">会议内容 <i>*</i></label>
        <textarea id="b-topic" name="topic" placeholder="例如：三季度经济运行调度会"></textarea>
      </div>
      <div class="grid2">
        <div class="ff">
          <label for="b-dept">科室 <i>*</i></label>
          <select id="b-dept" name="dept"><option value="">请选择</option></select>
        </div>
        <div class="ff" id="ff-dept-other">
          <label for="b-dept-other">自行填写科室</label>
          <input type="text" id="b-dept-other" name="deptOther" placeholder="不在上列时在此填写">
        </div>
      </div>
      <p class="hint">科室与自行填写科室 <b>二选一</b>：选定下拉后自行填写栏自动锁定清空；填入内容后下拉自动清空锁定。</p>
      <div class="ff">
        <label for="b-contact">联系人 <i>*</i></label>
        <input type="text" id="b-contact" name="contact" placeholder="姓名 / 电话">
      </div>
      <p class="warn hide" id="conflict-tip"></p>
      <p class="tip" id="form-tip"></p>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="btn-cancel-form">取消</button>
        <button type="submit" class="btn btn-primary" id="btn-submit">提交预约</button>
      </div>
    </form>
  </div>
</div>

<!-- 取消确认弹窗 -->
<div class="modal-mask" id="confirm-mask">
  <div class="modal narrow">
    <h3>取消预约</h3>
    <p id="confirm-text" style="font-size:13.5px;color:#5a6675;margin:0 0 6px"></p>
    <p style="font-size:12.5px;color:#c0392b;margin:0 0 18px">取消后该记录将被删除且不可恢复。</p>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="confirm-no">返回</button>
      <button type="button" class="btn btn-danger" id="confirm-yes">确认取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var DATABASE_ID = 'zQEJ6GAln8ovwvQxDvgxdw';
  var ROOMS = ['1号', '2号', '3号', '4号', '5号'];
  var DEPTS = ['党政办', '党建办', '经济办', '公服办', '平安办', '城管办', '应急办', '纪检办', '执法队'];
  var DRAFT_KEY = 'wb_meeting_booking_draft';
  var KEEP_MS = 24 * 60 * 60 * 1000;   // 会议结束满 1 天后自动清理
  var CLEAN_GAP_MS = 10 * 60 * 1000;   // 自动清理最小间隔

  var db = null;
  var SCHEMA_OPTIONS = {};
  var ALL_ROWS = [];
  var mode = 'room';
  var lastCleanupAt = 0;
  var pendingId = '';

  var el = function (id) { return document.getElementById(id); };
  var tbody = el('tbody');
  var statusEl = el('status');
  var emptyEl = el('empty');

  function toast(msg, isErr) {
    var t = el('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  function bindDb(node) {
    node.setAttribute('data-sp-bindable', 'database');
    node.setAttribute('data-sp-database-id', DATABASE_ID);
    return node;
  }

  function setStatusText(text) {
    statusEl.textContent = text;
    statusEl.appendChild(el('sync-time'));
    bindDb(statusEl);
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function dayOf(v) {
    if (!v) return '';
    var m = String(v).match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : String(v).slice(0, 10);
  }

  function weekOf(v) {
    var d = v ? new Date(String(v).replace(/-/g, '/')) : null;
    if (!d || isNaN(d.getTime())) return '';
    return '周' + '日一二三四五六'.charAt(d.getDay());
  }

  function tsOf(day, hm) {
    if (!day) return 0;
    var p = String(day).split('-');
    var t = String(hm || '').split(':');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), Number(t[0]) || 0, Number(t[1]) || 0, 0, 0);
    return isNaN(d.getTime()) ? 0 : d.getTime();
  }

  function endTs(row) { return tsOf(dayOf(row['日期']), row['结束时间'] || '23:59'); }
  function isPast(row) { var t = endTs(row); return t > 0 && t < Date.now(); }
  function roomIndex(name) { var i = ROOMS.indexOf(name); return i < 0 ? 99 : i; }
  function sortKey(row) { return dayOf(row['日期']) + ' ' + (row['开始时间'] || '99:99'); }
  function deptText(row) { return row['其他科室'] || row['科室'] || ''; }
  function selectedText(sel) {
    return sel.selectedIndex > 0 && sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
  }

  function cell(text, isStrong) {
    var td = document.createElement('td');
    td.textContent = text == null ? '' : String(text);
    if (isStrong) td.className = 'strong';
    bindDb(td);
    return td;
  }

  function option(text, value) {
    var o = document.createElement('option');
    o.textContent = text;
    o.value = value == null ? '' : String(value);
    return o;
  }

  /* ---------- 数据读取 ---------- */
  function loadAll(startCursor, acc, guard) {
    acc = acc || [];
    guard = guard || 0;
    if (!db) { setStatusText('当前环境未接入数据表，无法读取预约记录。'); return Promise.resolve(ALL_ROWS); }
    if (guard > 100) { onData(acc); return Promise.resolve(acc); }
    try {
      return db.query({
        databaseId: DATABASE_ID,
        sorts: [{ property: '日期', direction: 'ascending' }],
        pageSize: 200,
        startCursor: startCursor
      }).then(function (res) {
        acc = acc.concat(res.results || []);
        var next = res.nextCursor;
        if (res.hasMore && next && next !== startCursor && (res.results || []).length) {
          return loadAll(next, acc, guard + 1);
        }
        onData(acc);
        return acc;
      }).catch(function (err) {
        console.error('[database] 数据加载失败:', err);
        setStatusText('预约记录读取失败，请刷新页面或检查表格权限。');
        return acc;
      });
    } catch (err) {
      console.error('[database] 数据加载异常:', err);
      setStatusText('预约记录读取失败，请刷新页面重试。');
      return Promise.resolve(acc);
    }
  }

  function onData(rows) {
    ALL_ROWS = rows || [];
    renderTable();
    var t = new Date();
    el('sync-time').textContent = '最后更新 ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds());
    cleanupExpired();
  }

  /* ---------- 过期自动清理：结束满 1 天后删除 ---------- */
  function cleanupExpired() {
    if (!db) return;
    var now = Date.now();
    if (now - lastCleanupAt < CLEAN_GAP_MS) return;
    lastCleanupAt = now;

    var stale = [];
    for (var i = 0; i < ALL_ROWS.length; i++) {
      var t = endTs(ALL_ROWS[i]);
      if (t > 0 && now - t > KEEP_MS) stale.push(ALL_ROWS[i]);
    }
    if (!stale.length) return;

    var chain = Promise.resolve();
    stale.forEach(function (row) {
      chain = chain.then(function () {
        return db.deleteRecord({ databaseId: DATABASE_ID, recordId: row._id }).catch(function (err) {
          console.error('[database] 过期记录清理失败:', err);
        });
      });
    });
    chain.then(function () {
      toast('已自动清理 ' + stale.length + ' 条过期预约');
      loadAll();
    });
  }

  /* ---------- 表格渲染 ---------- */
  function filteredRows() {
    var d = el('f-date').value;
    var r = el('f-room').value;
    var p = el('f-dept').value;
    return ALL_ROWS.filter(function (row) {
      if (d && dayOf(row['日期']) !== d) return false;
      if (r && (row['会议室'] || '') !== r) return false;
      if (p && deptText(row) !== p) return false;
      return true;
    });
  }

  function renderTable() {
    var rows = filteredRows().slice();
    rows.sort(function (a, b) {
      if (mode === 'room') {
        var ra = roomIndex(a['会议室']), rb = roomIndex(b['会议室']);
        if (ra !== rb) return ra - rb;
        var na = String(a['会议室'] || ''), nb = String(b['会议室'] || '');
        if (na !== nb) return na < nb ? -1 : 1;
      }
      var pa = isPast(a) ? 1 : 0, pb = isPast(b) ? 1 : 0;
      if (pa !== pb) return pa - pb;
      var ka = sortKey(a), kb = sortKey(b);
      if (pa === 1) return ka < kb ? 1 : (ka > kb ? -1 : 0);   // 已结束的：最近结束排前面
      return ka < kb ? -1 : (ka > kb ? 1 : 0);
    });

    tbody.innerHTML = '';
    if (!rows.length) {
      emptyEl.className = 'empty';
      setStatusText('共 0 条预约记录');
      return;
    }
    emptyEl.className = 'empty hide';

    var frag = document.createDocumentFragment();
    var prevRoom = null;
    var pastCount = 0;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var room = row['会议室'] || '';
      var ri = roomIndex(room);
      var past = isPast(row);
      if (past) pastCount++;

      var tr = document.createElement('tr');
      tr.className = 'r' + ((ri % 5) + 1) + (past ? ' past' : '');
      if (mode === 'room' && prevRoom !== null && prevRoom !== room) tr.className += ' group-sep';
      prevRoom = room;

      var day = dayOf(row['日期']);
      var tdDay = cell(day);
      if (day) {
        var wk = document.createElement('div');
        wk.style.fontSize = '11.5px';
        wk.style.color = past ? '#b6bec8' : '#5a6675';
        wk.textContent = weekOf(day);
        tdDay.appendChild(wk);
      }
      tr.appendChild(tdDay);

      var time = (row['开始时间'] || '') + (row['结束时间'] ? ' - ' + row['结束时间'] : '');
      tr.appendChild(cell(time, true));

      var tdRoom = document.createElement('td');
      var tag = document.createElement('span');
      tag.className = 'room-tag';
      tag.textContent = room;
      bindDb(tag);
      tdRoom.appendChild(tag);
      tr.appendChild(tdRoom);

      var tdTopic = document.createElement('td');
      if (past) {
        var done = document.createElement('span');
        done.className = 'done-tag';
        done.textContent = '已结束';
        tdTopic.appendChild(done);
      }
      var txt = document.createElement('span');
      txt.textContent = row['会议内容'] || '';
      bindDb(txt);
      tdTopic.appendChild(txt);
      tr.appendChild(tdTopic);

      tr.appendChild(cell(deptText(row)));
      tr.appendChild(cell(row['联系人']));

      var tdOp = document.createElement('td');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-mini';
      btn.textContent = '取消预约';
      btn.setAttribute('data-id', row._id || '');
      tdOp.appendChild(btn);
      tr.appendChild(tdOp);

      frag.appendChild(tr);
    }
    tbody.appendChild(frag);

    var tip = '共 ' + rows.length + ' 条预约记录';
    if (el('f-date').value || el('f-room').value || el('f-dept').value) tip += '（已按条件筛选）';
    if (pastCount) tip += ' · 其中已结束 ' + pastCount + ' 条';
    setStatusText(tip);
  }

  /* ---------- 选项渲染 ---------- */
  function fillSelect(sel, opts, placeholder) {
    sel.innerHTML = '';
    sel.appendChild(option(placeholder, ''));
    for (var i = 0; i < opts.length; i++) sel.appendChild(option(opts[i].text, opts[i].text));
  }

  function optsOf(fieldName, fallback) {
    var opts = SCHEMA_OPTIONS[fieldName];
    if (!opts || !opts.length) {
      opts = [];
      for (var i = 0; i < fallback.length; i++) opts.push({ text: fallback[i] });
    }
    return opts;
  }

  function renderSelectOptions() {
    var roomOpts = optsOf('会议室', ROOMS).slice().sort(function (a, b) {
      return roomIndex(a.text) - roomIndex(b.text);
    });
    fillSelect(el('b-room'), roomOpts, '请选择');
    fillSelect(el('b-dept'), optsOf('科室', DEPTS), '请选择');
    fillSelect(el('f-room'), roomOpts, '全部会议室');
    fillSelect(el('f-dept'), optsOf('科室', DEPTS), '全部科室');
    restoreDraft();
  }

  function getDb() {
    var s = window.__SMART_PAGE__;
    return s && s.database;
  }

  function waitDb(n) {
    n = n || 0;
    var d = getDb();
    if (d) {
      db = d;
      registerSync();
      loadSchema();
      loadAll();
      return;
    }
    if (n >= 60) {
      renderSelectOptions();
      setStatusText('当前环境未接入数据表，无法读取预约记录。');
      return;
    }
    setTimeout(function () { waitDb(n + 1); }, 100);
  }

  function loadSchema() {
    if (!db) { renderSelectOptions(); return; }
    try {
      db.getSchema({ databaseId: DATABASE_ID }).then(function (schema) {
        (schema.properties || []).forEach(function (f) {
          if ((f.type === 'select' || f.type === 'multi_select') && f.config && f.config.options) {
            SCHEMA_OPTIONS[f.name] = f.config.options;
          }
        });
        renderSelectOptions();
      }).catch(function (err) {
        console.error('[database] schema 加载失败:', err);
        renderSelectOptions();
      });
    } catch (err) {
      console.error('[database] schema 加载异常:', err);
      renderSelectOptions();
    }
  }

  /* ---------- 实时同步 ---------- */
  var refreshTimer = null;
  var pendingRefresh = false;

  function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function () {
      if (el('mask').className.indexOf('open') !== -1 || el('confirm-mask').className.indexOf('open') !== -1) {
        pendingRefresh = true;
        return;
      }
      loadAll();
    }, 300);
  }

  function registerSync() {
    if (!db || typeof db.onUpdated !== 'function') return;
    try {
      db.onUpdated(function (payload) {
        var ids = (payload && payload.databaseIds) || [];
        if (ids.indexOf(DATABASE_ID) === -1) return;
        scheduleRefresh();
      });
    } catch (err) {
      console.error('[database] 实时同步注册失败:', err);
    }
  }

  /* ---------- 草稿缓存 ---------- */
  var draftTimer = null;
  function saveDraft() {
    if (draftTimer) clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          room: el('b-room').value, date: el('b-date').value,
          start: el('b-start').value, end: el('b-end').value,
          topic: el('b-topic').value, dept: el('b-dept').value,
          deptOther: el('b-dept-other').value, contact: el('b-contact').value
        }));
      } catch (e) { /* 存储不可用时静默降级 */ }
    }, 300);
  }

  function restoreDraft() {
    var raw = null;
    try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { raw = null; }
    if (!raw) return;
    var d;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d) return;
    if (d.room) el('b-room').value = d.room;
    if (d.date) el('b-date').value = d.date;
    if (d.start) el('b-start').value = d.start;
    if (d.end) el('b-end').value = d.end;
    if (d.topic) el('b-topic').value = d.topic;
    if (d.dept) el('b-dept').value = d.dept;
    if (d.deptOther) el('b-dept-other').value = d.deptOther;
    if (d.contact) el('b-contact').value = d.contact;
    syncDept();
  }

  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { }
  }

  /* ---------- 表单 ---------- */
  function syncDept() {
    var sel = el('b-dept');
    var other = el('b-dept-other');
    var otherVal = other.value.replace(/^\s+|\s+$/g, '');
    if (otherVal) {
      sel.value = '';
      sel.disabled = true;
      other.disabled = false;
      other.placeholder = '已自行填写，如需选择科室请清空此处';
    } else if (sel.value) {
      other.value = '';
      other.disabled = true;
      sel.disabled = false;
      other.placeholder = '已选择科室，如需自行填写请清空上方选择';
    } else {
      sel.disabled = false;
      other.disabled = false;
      other.placeholder = '不在上列时在此填写';
    }
  }

  function checkConflict(room, date, start, end) {
    for (var i = 0; i < ALL_ROWS.length; i++) {
      var row = ALL_ROWS[i];
      if ((row['会议室'] || '') !== room) continue;
      if (dayOf(row['日期']) !== date) continue;
      var s = row['开始时间'] || '';
      var e = row['结束时间'] || '';
      if (!s || !e) continue;
      if (start < e && s < end) return row;
    }
    return null;
  }

  function conflictText(c) {
    return '时段冲突：' + dayOf(c['日期']) + ' ' + (c['开始时间'] || '') + '-' + (c['结束时间'] || '') +
      ' 已有「' + (c['会议内容'] || '') + '」（' + deptText(c) + ' · ' + (c['联系人'] || '') + '），请另选时段。';
  }

  function updateConflictHint() {
    var node = el('conflict-tip');
    var room = selectedText(el('b-room'));
    var date = el('b-date').value;
    var start = el('b-start').value;
    var end = el('b-end').value;
    if (!room || !date || !start || !end || end <= start) {
      node.textContent = '';
      node.className = 'warn hide';
      return;
    }
    var c = checkConflict(room, date, start, end);
    if (c) {
      node.textContent = conflictText(c);
      node.className = 'warn';
    } else {
      node.textContent = '';
      node.className = 'warn hide';
    }
  }

  function openModal() {
    if (el('b-room').options.length <= 1 && db) loadSchema();
    el('mask').className = 'modal-mask open';
    if (!el('b-date').value) el('b-date').value = dayOf(new Date().toISOString());
    syncDept();
    updateConflictHint();
  }

  function closeModal() {
    el('mask').className = 'modal-mask';
    if (pendingRefresh) { pendingRefresh = false; loadAll(); }
  }

  function submitForm(e) {
    e.preventDefault();
    var tip = el('form-tip');
    tip.textContent = '';
    var roomId = el('b-room').value;
    var roomText = selectedText(el('b-room'));
    var date = el('b-date').value;
    var start = el('b-start').value;
    var end = el('b-end').value;
    var topic = el('b-topic').value.replace(/^\s+|\s+$/g, '');
    var deptId = el('b-dept').value;
    var deptOther = el('b-dept-other').value.replace(/^\s+|\s+$/g, '');
    var contact = el('b-contact').value.replace(/^\s+|\s+$/g, '');

    if (!roomId) { tip.textContent = '请选择会议室'; return; }
    if (!date) { tip.textContent = '请选择日期'; return; }
    if (!start || !end) { tip.textContent = '请填写开始与结束时间'; return; }
    if (end <= start) { tip.textContent = '结束时间需晚于开始时间'; return; }
    if (!topic) { tip.textContent = '请填写会议内容'; return; }
    if (!deptId && !deptOther) { tip.textContent = '请选择科室，或在自行填写科室栏填写'; return; }
    if (deptId && deptOther) { tip.textContent = '科室与自行填写科室只能填一个'; return; }
    if (!contact) { tip.textContent = '请填写联系人'; return; }
    if (!db) { tip.textContent = '当前环境未接入数据表，无法提交预约'; return; }

    var btn = el('btn-submit');
    btn.disabled = true;
    btn.textContent = '提交中…';

    var properties = {
      '日期': { date: date },
      '开始时间': { text: start },
      '结束时间': { text: end },
      '会议室': { select: roomId },
      '会议内容': { text: topic },
      '联系人': { text: contact }
    };
    if (deptId) properties['科室'] = { select: deptId };
    else properties['其他科室'] = { text: deptOther };

    var done = function () {
      btn.disabled = false;
      btn.textContent = '提交预约';
    };

    loadAll().then(function () {
      var conflict = checkConflict(roomText, date, start, end);
      if (conflict) {
        tip.textContent = '';
        el('conflict-tip').textContent = conflictText(conflict);
        el('conflict-tip').className = 'warn';
        done();
        return;
      }
      try {
        return db.addRecord({ databaseId: DATABASE_ID, properties: properties }).then(function () {
          clearDraft();
          el('book-form').reset();
          syncDept();
          el('conflict-tip').textContent = '';
          el('conflict-tip').className = 'warn hide';
          closeModal();
          toast('预约提交成功');
          loadAll();
        }).catch(function (err) {
          console.error('[database] 提交失败:', err);
          tip.textContent = '提交失败，请稍后重试（草稿已保留）';
        });
      } catch (err) {
        console.error('[database] 提交异常:', err);
        tip.textContent = '提交失败，请稍后重试（草稿已保留）';
      }
    }).catch(function (err) {
      console.error('[database] 校验失败:', err);
      tip.textContent = '提交失败，请稍后重试（草稿已保留）';
    }).then(done);
  }

  /* ---------- 取消预约 ---------- */
  function askCancel(recordId) {
    var row = null;
    for (var i = 0; i < ALL_ROWS.length; i++) {
      if (ALL_ROWS[i]._id === recordId) { row = ALL_ROWS[i]; break; }
    }
    if (!row) { toast('未找到该预约记录，请刷新后重试', true); return; }
    pendingId = recordId;
    var t = el('confirm-text');
    t.textContent = dayOf(row['日期']) + ' ' + (row['开始时间'] || '') + '-' + (row['结束时间'] || '') +
      ' · ' + (row['会议室'] || '') + ' · ' + (row['会议内容'] || '');
    el('confirm-mask').className = 'modal-mask open';
  }

  function closeConfirm() {
    el('confirm-mask').className = 'modal-mask';
    pendingId = '';
    if (pendingRefresh) { pendingRefresh = false; loadAll(); }
  }

  function doCancel() {
    if (!pendingId || !db) { closeConfirm(); return; }
    var id = pendingId;
    var btn = el('confirm-yes');
    btn.disabled = true;
    btn.textContent = '取消中…';
    try {
      db.deleteRecord({ databaseId: DATABASE_ID, recordId: id }).then(function () {
        closeConfirm();
        toast('预约已取消');
        loadAll();
      }).catch(function (err) {
        console.error('[database] 取消失败:', err);
        toast('取消失败，请稍后重试', true);
        closeConfirm();
      }).then(function () {
        btn.disabled = false;
        btn.textContent = '确认取消';
      });
    } catch (err) {
      console.error('[database] 取消异常:', err);
      toast('取消失败，请稍后重试', true);
      btn.disabled = false;
      btn.textContent = '确认取消';
      closeConfirm();
    }
  }

  /* ---------- 事件绑定 ---------- */
  el('btn-book').onclick = openModal;
  el('btn-cancel-form').onclick = closeModal;
  el('mask').onclick = function (e) { if (e.target === el('mask')) closeModal(); };
  el('book-form').addEventListener('submit', submitForm);

  el('confirm-no').onclick = closeConfirm;
  el('confirm-yes').onclick = doCancel;
  el('confirm-mask').onclick = function (e) { if (e.target === el('confirm-mask')) closeConfirm(); };

  tbody.onclick = function (e) {
    var target = e.target;
    if (target && target.getAttribute && target.getAttribute('data-id')) {
      askCancel(target.getAttribute('data-id'));
    }
  };

  el('b-dept').addEventListener('change', function () { syncDept(); saveDraft(); });
  ['b-room', 'b-date', 'b-start', 'b-end'].forEach(function (id) {
    el(id).addEventListener('change', updateConflictHint);
  });
  el('b-start').addEventListener('input', updateConflictHint);
  el('b-end').addEventListener('input', updateConflictHint);
  ['b-room', 'b-date', 'b-start', 'b-end', 'b-topic', 'b-contact'].forEach(function (id) {
    el(id).addEventListener('input', saveDraft);
    el(id).addEventListener('change', saveDraft);
  });
  el('b-dept-other').addEventListener('input', function () { syncDept(); saveDraft(); });
  el('b-dept-other').addEventListener('change', function () { syncDept(); saveDraft(); });

  el('f-date').addEventListener('change', renderTable);
  el('f-room').addEventListener('change', renderTable);
  el('f-dept').addEventListener('change', renderTable);
  el('btn-reset').onclick = function () {
    el('f-date').value = '';
    el('f-room').value = '';
    el('f-dept').value = '';
    renderTable();
  };
  el('seg-room').onclick = function () {
    mode = 'room';
    el('seg-room').className = 'on';
    el('seg-time').className = '';
    renderTable();
  };
  el('seg-time').onclick = function () {
    mode = 'time';
    el('seg-time').className = 'on';
    el('seg-room').className = '';
    renderTable();
  };

  waitDb();
})();
</script>
</body>
</html>
